name: Import public household flexibility data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch_household_flexibility.yml"
      - "external/household_flexibility/README.md"
      - "external/household_flexibility/fetch_datasets.py"

permissions:
  contents: write

jobs:
  download:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download and verify source data
        shell: bash
        run: |
          python external/household_flexibility/fetch_datasets.py || true
      - name: Commit only successfully imported data and manifest
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add external/household_flexibility/data/ external/household_flexibility/download_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Import verified Norwegian EV and OPSD household source files"
            git push
          fi
